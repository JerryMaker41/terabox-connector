# Render Blueprint: one free web service. Deploy with
#   https://render.com/deploy?repo=https://github.com/<you>/terabox-connector
services:
  - type: web
    name: terabox-connector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ACCESS_KEY
        generateValue: true     # Render makes a long random secret
      - key: HF_TOKEN
        sync: false             # you paste a Hugging Face READ token when deploying
      - key: HF_DATASET
        sync: false             # e.g. yourname/terabox-data
